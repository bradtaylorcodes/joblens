[project]
name = "joblens"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "anthropic>=1.15.0",
    "pydantic>=2.14.1",
]

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
